 Mono, Consolas, monospace' font-size='15' font-weight='400' fill='#f4f1f8' text-anchor='middle'>9</text><text x='44' y='496' font-family='JetBrains Mono, Consolas, monospace' font-size='14' font-weight='400' fill='#a8a1b5' text-anchor='start'>suma = 2 + 2 + 6 + 4 + 1 + 6 + 5 + 8 + 9 = 43</text><rect x='44' y='512' width='764' height='36' rx='6' fill='#4ade80' fill-opacity='0.16' stroke='#4ade80' stroke-width='1.5'/><text x='60' y='536' font-family='JetBrains Mono, Consolas, monospace' font-size='15' font-weight='600' fill='#f4f1f8' text-anchor='start'>(10 - 43 mod 10) mod 10 = (10 - 3) mod 10 = 7   coincide con el décimo dígito</text></svg>
